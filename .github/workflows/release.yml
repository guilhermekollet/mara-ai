name: Release

# Pushing a version tag (v0.1.0, v0.2.0, ...) builds the app, packages it and publishes a GitHub
# release with the zip and its checksum. The version in the app comes from the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # Same runner as CI: the app needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Package
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The install notes come first, then the notes GitHub generates from the merged PRs.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "Mara AI ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
