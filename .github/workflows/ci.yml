name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (build and test)
    # The app uses APIs from the macOS 26 SDK (SpeechAnalyzer), so it needs a runner with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test

  web:
    name: Website (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
